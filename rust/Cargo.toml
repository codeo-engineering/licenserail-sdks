[package]
name = "licenserail"
version = "0.1.2"
edition = "2021"
license = "MIT"
authors = ["Codeo Solutions Limited"]
description = "LicenseRail client SDK: offline license verification, activation, refresh and floating leases."
repository = "https://github.com/codeo-engineering/licenserail-sdks"
homepage = "https://licenserail.com"
readme = "README.md"
# The vector tests need ../test-vectors, which is not in the package.
exclude = ["tests"]
rust-version = "1.70"

[dependencies]
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
ureq = { version = "2", features = ["json"] }
