<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="license.css">
  </head>
  <body>
    <main id="root">
      <h1>License</h1>
      <section id="status" class="card" aria-live="polite">Loading…</section>
      <section class="card">
        <h2>Activate a license key</h2>
        <p id="key-hint"></p>
        <div class="actions">
          <button id="activate" class="primary" disabled>Activate</button>
          <button id="refresh" disabled>Check now</button>
          <button id="deactivate" disabled>Release this instance</button>
        </div>
      </section>
      <section class="card" id="trial-card" hidden>
        <h2>Trial</h2>
        <p>Try the app on this YouTrack instance without a key. One trial per instance.</p>
        <div class="actions"><button id="trial">Start trial</button></div>
      </section>
      <p id="message" class="message" role="status"></p>
    </main>
    <script type="module" src="license.js"></script>
  </body>
</html>
