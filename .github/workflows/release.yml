name: Release

# Started by hand only. Without "publish" it builds and checks the package and keeps it as an artifact; nothing leaves GitHub.
# Accounts, secrets and the order: RELEASING.md.
on:
  workflow_dispatch:
    inputs:
      package:
        description: What to release
        type: choice
        required: true
        options: [npm-licenserail, npm-embedded, npm-youtrack, nuget, pypi, crates, maven, go, cpp, swift, php, cli]
      version:
        description: Version (x.y.z), must match the manifests
        type: string
        required: true
      publish:
        description: Publish for real (cannot be undone)
        type: boolean
        default: false

permissions:
  contents: read

concurrency: release

env:
  VERSION: ${{ inputs.version }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Publish from main only
        if: inputs.publish && github.ref != 'refs/heads/main'
        run: |
          echo "Publishing is only allowed from main."
          exit 1
      # These are fetched straight from this repository, so a private one would publish something nobody can download.
      - name: Public repository needed
        if: inputs.publish && github.event.repository.private && contains(fromJSON('["go","cpp","cli"]'), inputs.package)
        run: |
          echo "Make the repository public first."
          exit 1
      - uses: actions/checkout@v5
      - run: node tools/check-versions.mjs "$VERSION"

  tests:
    needs: check
    uses: ./.github/workflows/sdks.yml

  # Nothing is published unless every SDK works against a real API.
  e2e:
    needs: check
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/e2e.yml

  npm:
    needs: [tests, e2e]
    if: startsWith(inputs.package, 'npm-')
    runs-on: ubuntu-latest
    environment: ${{ inputs.publish && 'release' || '' }}
    permissions:
      contents: read
      id-token: write
    env:
      FOLDER: ${{ inputs.package == 'npm-licenserail' && 'typescript' || inputs.package == 'npm-embedded' && 'embedded' || 'youtrack' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, registry-url: 'https://registry.npmjs.org' }
      # licenserail-youtrack bundles the source of licenserail-embedded.
      - if: inputs.package == 'npm-youtrack'
        run: npm ci
        working-directory: embedded
      - run: npm ci && npm run build && npm pack
        working-directory: ${{ env.FOLDER }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.package }}
          path: ${{ env.FOLDER }}/*.tgz
          if-no-files-found: error
      - if: inputs.publish
        run: npm publish ./*.tgz --access public
        working-directory: ${{ env.FOLDER }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Provenance works for public repositories only.
          NPM_CONFIG_PROVENANCE: ${{ !github.event.repository.private }}

  nuget:
    needs: [tests, e2e]
    if: inputs.package == 'nuget'
    runs-on: ubuntu-latest
    environment: ${{ inputs.publish && 'release' || '' }}
    permissions:
      contents: read
      id-token: write   # NuGet trusted publishing: a one-hour key in exchange for the GitHub token
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: 8.0.x }
      - run: dotnet pack dotnet/src/LicenseRail/LicenseRail.csproj -c Release -p:ContinuousIntegrationBuild=true -o out
      - uses: actions/upload-artifact@v4
        with: { name: nuget, path: out/*.nupkg, if-no-files-found: error }
      - if: inputs.publish
        id: login
        uses: NuGet/login@v1
        with: { user: "${{ vars.NUGET_USER }}" }
      - if: inputs.publish
        run: dotnet nuget push out/*.nupkg --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY"
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}

  pypi:
    needs: [tests, e2e]
    if: inputs.package == 'pypi'
    runs-on: ubuntu-latest
    environment: ${{ inputs.publish && 'release' || '' }}
    permissions:
      contents: read
      id-token: write   # PyPI trusted publishing, no token needed
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: pip install build twine && python -m build python --outdir dist && twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with: { name: pypi, path: dist/*, if-no-files-found: error }
      - if: inputs.publish
        uses: pypa/gh-action-pypi-publish@release/v1

  crates:
    needs: [tests, e2e]
    if: inputs.package == 'crates'
    runs-on: ubuntu-latest
    environment: ${{ inputs.publish && 'release' || '' }}
    defaults: { run: { working-directory: rust } }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo package
      - uses: actions/upload-artifact@v4
        with: { name: crates, path: rust/target/package/*.crate, if-no-files-found: error }
      - if: inputs.publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  maven:
    needs: [tests, e2e]
    if: inputs.package == 'maven'
    runs-on: ubuntu-latest
    environment: ${{ inputs.publish && 'release' || '' }}
    defaults: { run: { working-directory: java } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - run: mvn -B -Prelease -Dgpg.skip verify
      - uses: actions/upload-artifact@v4
        with: { name: maven, path: java/target/*.jar, if-no-files-found: error }
      # Writes the Maven settings and imports the signing key.
      - if: inputs.publish
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      # Uploads and validates; the release itself is confirmed by a person on central.sonatype.com.
      - if: inputs.publish
        run: mvn -B -Prelease deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

  # Go modules and the C++ sources are fetched from this repository: the release is a tag.
  tag:
    needs: [tests, e2e]
    if: inputs.package == 'go' || inputs.package == 'cpp'
    runs-on: ubuntu-latest
    environment: ${{ inputs.publish && 'release' || '' }}
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.package == 'go' && 'go/v' || 'v' }}${{ inputs.version }}
    steps:
      - uses: actions/checkout@v5
      - run: echo "Tag $TAG on $GITHUB_SHA"
      - if: inputs.publish
        run: git tag "$TAG" && git push origin "$TAG"

  # SwiftPM and Packagist need their manifest at the root of a repository, so these folders are copied to their own.
  mirror:
    needs: [tests, e2e]
    if: inputs.package == 'swift' || inputs.package == 'php'
    runs-on: ubuntu-latest
    environment: ${{ inputs.publish && 'release' || '' }}
    env:
      FOLDER: ${{ inputs.package }}
      MIRROR: git@github.com:codeo-engineering/licenserail-${{ inputs.package }}.git
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - run: |
          git subtree split --prefix="$FOLDER" -b mirror
          git ls-tree -r --name-only mirror
      - if: inputs.publish
        env:
          DEPLOY_KEY: ${{ inputs.package == 'swift' && secrets.SWIFT_DEPLOY_KEY || secrets.PHP_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          (umask 077 && printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/mirror)
          curl -fsS https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' > ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/mirror -o IdentitiesOnly=yes"
          git push --atomic "$MIRROR" mirror:refs/heads/main "mirror:refs/tags/$VERSION"

  # A draft GitHub release; publishing the draft creates the tag.
  cli:
    needs: [tests, e2e]
    if: inputs.package == 'cli'
    runs-on: ubuntu-latest
    environment: ${{ inputs.publish && 'release' || '' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: stable }
      - working-directory: cli
        run: |
          mkdir ../out
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${t%/*}; arch=${t#*/}; ext=; if [ "$os" = windows ]; then ext=.exe; fi
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags '-s -w' -o "../out/licenserail-$os-$arch$ext" ./cmd/licenserail
          done
          cd ../out && sha256sum licenserail-* > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with: { name: cli, path: out/*, if-no-files-found: error }
      - if: inputs.publish
        run: gh release create "cli/v$VERSION" out/* --draft --target "$GITHUB_SHA" --title "licenserail CLI $VERSION" --notes ""
        env:
          GH_TOKEN: ${{ github.token }}
