[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "licenserail"
version = "0.1.2"
description = "LicenseRail client SDK: offline license verification, activation, refresh, floating leases and the management API."
readme = "README.md"
license = "MIT"
authors = [{ name = "Codeo Solutions Limited" }]
requires-python = ">=3.10"
dependencies = ["cryptography>=41"]

[project.urls]
Homepage = "https://licenserail.com"
Repository = "https://github.com/codeo-engineering/licenserail-sdks"

[tool.hatch.build.targets.wheel]
packages = ["src/licenserail"]
